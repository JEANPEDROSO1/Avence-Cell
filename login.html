<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Avence Cell</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/main.css">
    
    <style>
        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #0f172a;
            font-family: 'Outfit', sans-serif;
            overflow: hidden; position: relative;
            color: #fff;
        }

        /* Animated Background Elements */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
            z-index: 1;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #3b82f6; }
        .blob-2 { bottom: -20%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        .login-wrapper {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: rgba(30, 41, 59, 0.7);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-sizing: border-box;
        }

        .logo-preview {
            width: 100%; height: 140px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px auto;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
        }

        .logo-preview i { font-size: 64px; color: #3b82f6; }

        .login-box h2 {
            margin: 0 0 4px 0; font-size: 28px; font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-box p { color: #94a3b8; margin: 0 0 24px 0; font-size: 15px; }

        .form-group { text-align: left; margin-bottom: 20px; position: relative; }
        .form-group label {
            display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 500;
        }
        
        .form-control {
            width: 100%; padding: 14px 16px; font-size: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: #fff;
            outline: none; transition: all 0.3s;
            box-sizing: border-box; font-family: 'Outfit', sans-serif;
        }
        
        select.form-control {
            appearance: none; cursor: pointer;
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: rgba(15, 23, 42, 0.9);
        }

        .password-container { position: relative; }
        #senha { letter-spacing: 4px; font-family: monospace; font-size: 18px; }

        .btn-login {
            width: 100%; padding: 16px; margin-top: 12px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
            font-family: 'Outfit', sans-serif;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(59, 130, 246, 0.7);
        }
        .btn-login:active { transform: translateY(0); }

        /* Toast notifications */
        #toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
        .toast {
            min-width: 250px; padding: 16px; border-radius: 12px; color: #fff; font-size: 14px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            font-family: 'Outfit', sans-serif;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        .toast.success { background: #10b981; border: 1px solid #059669; }
        .toast.error { background: #ef4444; border: 1px solid #dc2626; }
        .toast.warning { background: #f59e0b; border: 1px solid #d97706; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-wrapper">
        <div class="login-box">
            <div class="logo-preview" id="logo-preview">
                <i class="ph ph-storefront"></i>
            </div>
            
            <h2 id="loja-nome">Avence Cell</h2>
            <p>Área Restrita do Sistema</p>

            <form id="login-form">
                <div class="form-group">
                    <label>Nome do Colaborador</label>
                    <input type="text" id="nome-usuario" class="form-control" placeholder="Digite seu nome" autocomplete="username" required>
                </div>

                <div class="form-group password-container">
                    <label>Senha de Acesso</label>
                    <input type="password" id="senha" class="form-control" placeholder="****" autocomplete="current-password" required>
                </div>
                
                <button type="submit" class="btn-login" id="btn-entrar">
                    Entrar no Sistema <i class="ph ph-arrow-right" style="margin-left: 8px; vertical-align: middle;"></i>
                </button>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/login.js"></script>
</body>
</html>
